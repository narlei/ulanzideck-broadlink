name: Release

# A version bump in manifest.json is the trigger; the tag is derived from it
# rather than pushed by hand. workflow_dispatch covers the first release, since
# a path filter has no earlier commit to diff against when a branch is created.
on:
  push:
    branches: [main]
    paths:
      - 'com.narlei.broadlink.ulanziPlugin/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "version=$(jq -r .Version com.narlei.broadlink.ulanziPlugin/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `make package` is the one packaging path, and it installs production
      # dependencies before zipping. Rebuilding the archive inline here is how
      # published plugins ended up without node_modules — the process then dies
      # on its first import, before a single line of its own code runs.
      - name: Build plugin ZIP
        if: steps.check.outputs.exists == 'false'
        run: make package

      - name: Verify dependencies are bundled
        if: steps.check.outputs.exists == 'false'
        run: |
          if ! unzip -l "dist/com.narlei.broadlink.ulanziPlugin.zip" | grep -q "node_modules/"; then
            echo "::error::The archive has no node_modules — the plugin would not start. Refusing to publish."
            exit 1
          fi
          echo "✓ $(unzip -l "dist/com.narlei.broadlink.ulanziPlugin.zip" | grep -c 'node_modules/') bundled dependency files"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --generate-notes \
            --latest \
            "dist/com.narlei.broadlink.ulanziPlugin.zip"
